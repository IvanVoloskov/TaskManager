services:
  postgres:
    image: postgres:16
    container_name: taskmanager-db
    environment:
      POSTGRES_DB: taskmanager
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
  redis:
    image: redis:7
    container_name: taskmanager-redis
    ports:
      - "6379:6379"
  kafka:
    image: apache/kafka:3.9.0
    container_name: taskmanager-kafka
    ports:
      - "9092:9092"